name: Android build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets the tag job attach files to a GitHub Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          # The action's default package list contains the retired "tools" package, which makes sdkmanager fail.
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Lint (report only, does not fail the build)
        continue-on-error: true
        run: gradle lintDebug

      - uses: actions/upload-artifact@v4
        with:
          name: pixora-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

  release-aab:
    name: Signed release AAB
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        id: sign
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KSP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KP: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KSP" ] || [ -z "$KA" ] || [ -z "$KP" ]; then
            echo "::error::Missing signing secrets. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD in Settings > Secrets and variables > Actions (see GITHUB_ACTIONS_SETUP.md)."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          # The action's default package list contains the retired "tools" package, which makes sdkmanager fail.
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Restore signing key
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KSP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KP: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KS" | tr -d '\r\n ' | base64 --decode > pixora-release.jks
          STOREPASS="$(printf '%s' "$KSP" | tr -d '\r\n')"
          KEYPASS="$(printf '%s' "$KP" | tr -d '\r\n')"
          ALIAS="$(printf '%s' "$KA" | tr -d '\r\n' | sed 's/^ *//;s/ *$//')"

          if ! keytool -list -keystore pixora-release.jks -storepass "$STOREPASS" > aliases.txt 2>&1; then
            echo "::error::Cannot open the keystore. KEYSTORE_PASSWORD is wrong or KEYSTORE_BASE64 is not the full base64 of your .jks file."
            exit 1
          fi
          echo "Entries found in the keystore:"
          grep -E "PrivateKeyEntry|trustedCertEntry" aliases.txt | sed 's/,.*,/  ->/' || true

          if ! keytool -list -keystore pixora-release.jks -storepass "$STOREPASS" -alias "$ALIAS" > /dev/null 2>&1; then
            COUNT="$(grep -c "PrivateKeyEntry" aliases.txt || true)"
            if [ "$COUNT" = "1" ]; then
              ALIAS="$(grep "PrivateKeyEntry" aliases.txt | sed 's/,.*//')"
              echo "::warning::KEY_ALIAS secret did not match; using the only key in the keystore: $ALIAS. Update the KEY_ALIAS secret to this value."
            else
              echo "::error::KEY_ALIAS does not match any key in the keystore. Set KEY_ALIAS to one of the aliases listed above."
              exit 1
            fi
          fi

          {
            echo "storeFile=pixora-release.jks"
            echo "storePassword=$STOREPASS"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEYPASS"
          } > keystore.properties
          rm -f aliases.txt

      - name: Build signed AAB
        run: gradle bundleRelease -PversionCodeOverride=${{ github.run_number }} --stacktrace

      - name: Remove signing key from the runner
        if: always()
        run: rm -f pixora-release.jks keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: pixora-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 90

      - name: Attach AAB to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/bundle/release/*.aab
